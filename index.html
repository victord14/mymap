<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1A2B3C">
    <title>Hotel Agua del Corral - Mendoza</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- PapaParse: lectura del CSV del Google Sheet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        :root {
            --primary-dark: #1A2B3C;
            --accent-gold: #C5A059;
            --bg-light: #F8F9FA;
            --text-main: #2D3748;
            --shadow-card: 0 10px 25px rgba(0, 0, 0, 0.15);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;   /* respaldo */
            height: 100dvh;  /* celulares: descuenta la barra del navegador */
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }

        /* ---------- Encabezado ---------- */
        header {
            background: linear-gradient(135deg, #111E2B 0%, var(--primary-dark) 100%);
            color: #FFF;
            padding: calc(10px + var(--safe-top)) calc(16px + var(--safe-right)) 10px calc(16px + var(--safe-left));
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,.15);
            z-index: 1000;
            border-bottom: 2px solid var(--accent-gold);
            flex: 0 0 auto;
        }
        .brand-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.05rem, 4vw, 1.4rem);
            font-weight: 700;
            letter-spacing: .5px;
            line-height: 1.15;
        }
        .brand-subtitle {
            font-size: clamp(.62rem, 2.4vw, .75rem);
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            margin-top: 2px;
        }

        .lang-switch {
            display: flex;
            background: rgba(255,255,255,.1);
            border-radius: 999px;
            padding: 3px;
            flex: 0 0 auto;
        }
        .lang-btn {
            border: none;
            background: transparent;
            color: #FFF;
            font: 600 .75rem 'Plus Jakarta Sans', sans-serif;
            padding: 7px 11px;
            border-radius: 999px;
            cursor: pointer;
            min-height: 32px;
        }
        .lang-btn.active { background: var(--accent-gold); color: #1A1A1A; }

        /* ---------- Barra de herramientas: buscador + categorías ---------- */
        .toolbar {
            background: #FFF;
            padding: 10px calc(14px + var(--safe-right)) 10px calc(14px + var(--safe-left));
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
            position: relative;
            z-index: 1100;
            flex: 0 0 auto;
        }

        .search-wrap { position: relative; flex: 1 1 240px; min-width: 0; }
        .search-wrap > i {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #718096; font-size: .9rem; pointer-events: none;
        }
        #search {
            width: 100%;
            height: 42px;
            border: 1px solid #E2E8F0;
            background: #F7FAFC;
            border-radius: 21px;
            padding: 0 14px 0 38px;
            font: 400 16px 'Plus Jakarta Sans', sans-serif; /* 16px evita el zoom automático en iOS */
            color: var(--text-main);
            outline: none;
        }
        #search:focus { border-color: var(--accent-gold); background: #FFF; box-shadow: 0 0 0 3px rgba(197,160,89,.2); }

        #results {
            position: absolute;
            top: calc(100% + 6px);
            left: 0; right: 0;
            background: #FFF;
            border-radius: 12px;
            box-shadow: var(--shadow-card);
            max-height: min(45vh, 320px);
            overflow-y: auto;
            display: none;
            z-index: 1300;
        }
        #results.open { display: block; }
        .result-item {
            display: flex; align-items: center; gap: 10px;
            width: 100%;
            padding: 10px 12px;
            border: none; background: transparent;
            text-align: left;
            cursor: pointer;
            font: 500 .9rem 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            border-bottom: 1px solid #EDF2F7;
        }
        .result-item:last-child { border-bottom: none; }
        .result-item:hover, .result-item:focus { background: #F7FAFC; outline: none; }
        .result-dot {
            flex: 0 0 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #FFF; font-size: .75rem;
        }
        .result-text small { display: block; color: #718096; font-weight: 400; font-size: .75rem; }
        .no-results { padding: 14px; color: #718096; font-size: .88rem; }

        .cat-wrap { position: relative; flex: 1 1 200px; min-width: 0; }
        .cat-wrap > i { position: absolute; top: 50%; transform: translateY(-50%); color: #718096; font-size: .85rem; pointer-events: none; }
        .cat-wrap > i:first-child { left: 14px; }
        .cat-wrap > .caret { right: 14px; font-size: .75rem; }
        #cat-select {
            width: 100%; height: 42px;
            border: 1px solid #E2E8F0; background: #F7FAFC;
            border-radius: 21px;
            padding: 0 36px 0 38px;
            font: 500 16px 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            appearance: none; -webkit-appearance: none;
            outline: none; cursor: pointer;
            text-overflow: ellipsis;
        }
        #cat-select:focus { border-color: var(--accent-gold); background: #FFF; box-shadow: 0 0 0 3px rgba(197,160,89,.2); }
        @media (max-height: 480px) { #cat-select { height: 36px; } }

        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            flex: 1 1 100%;
            padding-bottom: 2px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            background: #EDF2F7;
            color: var(--text-main);
            border: none;
            padding: 8px 14px;
            min-height: 38px;
            border-radius: 20px;
            font: 500 .85rem 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
            display: inline-flex; align-items: center; gap: 7px;
            transition: background .2s, color .2s;
            flex: 0 0 auto;
        }
        .chip:hover, .chip.active { background: var(--primary-dark); color: #FFF; }

        @media (min-width: 900px) {
            .chips { flex: 2 1 420px; }
        }

        /* ---------- Mapa ---------- */
        #map-container { flex: 1 1 auto; min-height: 0; width: 100%; position: relative; }
        #map { width: 100%; height: 100%; background: #E8EEF2; }

        .leaflet-bottom.leaflet-right .leaflet-control-zoom { margin-bottom: calc(26px + var(--safe-bottom)); margin-right: calc(10px + var(--safe-right)); }
        .leaflet-bottom.leaflet-right .leaflet-control-attribution { margin-bottom: var(--safe-bottom); }
        .leaflet-control-zoom a { width: 38px !important; height: 38px !important; line-height: 38px !important; }

        /* Botones flotantes */
        .fabs {
            position: absolute;
            right: calc(10px + var(--safe-right));
            bottom: calc(138px + var(--safe-bottom));
            display: flex; flex-direction: column; gap: 8px;
            z-index: 900;
        }
        .fab {
            width: 44px; height: 44px;
            border: none; border-radius: 50%;
            background: #FFF; color: var(--primary-dark);
            box-shadow: 0 3px 10px rgba(0,0,0,.25);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.05rem;
        }
        .fab:hover { background: #F1F5F9; }
        .fab.on { background: var(--accent-gold); color: #FFF; }

        /* Selector de mapa base */
        #layer-panel {
            position: absolute;
            right: calc(64px + var(--safe-right));
            bottom: calc(138px + var(--safe-bottom));
            background: #FFF; border-radius: 12px; box-shadow: var(--shadow-card);
            padding: 6px; z-index: 920; display: none;
            min-width: 190px; max-width: calc(100vw - 90px);
        }
        #layer-panel.open { display: block; }
        .lp-title { font-weight: 600; font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; color: #718096; padding: 6px 10px; }
        .lp-item {
            display: flex; align-items: center; gap: 8px; width: 100%;
            border: none; background: transparent; padding: 10px; min-height: 40px;
            border-radius: 8px; font: 500 .88rem 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main); cursor: pointer; text-align: left;
        }
        .lp-item:hover { background: #F7FAFC; }
        .lp-item.active { background: #FBF5E8; color: var(--primary-dark); font-weight: 600; }
        .lp-item i { width: 16px; color: var(--accent-gold); visibility: hidden; }
        .lp-item.active i { visibility: visible; }
        @media (max-height: 480px) {
            #layer-panel { right: auto; left: calc(10px + var(--safe-left)); bottom: calc(72px + var(--safe-bottom)); max-height: calc(100% - 90px); overflow-y: auto; }
        }

        /* Estado de carga / avisos */
        #status {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
            background: rgba(248,249,250,.85);
            z-index: 950;
            font-size: .95rem; color: var(--primary-dark);
            text-align: center; padding: 20px;
        }
        #status.hidden { display: none; }
        .spinner {
            width: 34px; height: 34px;
            border: 4px solid #CBD5E0; border-top-color: var(--accent-gold);
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #toast {
            position: absolute;
            left: 50%; bottom: calc(18px + var(--safe-bottom));
            transform: translateX(-50%);
            background: rgba(26,43,60,.95); color: #FFF;
            padding: 10px 16px; border-radius: 10px;
            font-size: .85rem; max-width: min(90vw, 420px); text-align: center;
            z-index: 960; display: none;
            box-shadow: var(--shadow-card);
        }
        #toast.show { display: block; }

        /* ---------- Popups ---------- */
        .leaflet-popup-content-wrapper { border-radius: 12px; padding: 4px; box-shadow: var(--shadow-card); font-family: 'Plus Jakarta Sans', sans-serif; }
        .leaflet-popup-content { margin: 12px 14px; width: min(250px, 66vw) !important; }
        .popup-card h4 { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--primary-dark); margin-bottom: 4px; }
        .popup-cat { display: inline-block; font-size: .68rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-gold); font-weight: 600; margin-bottom: 6px; }
        .popup-desc { font-size: .85rem; color: #4A5568; margin-bottom: 10px; line-height: 1.45; overflow-wrap: anywhere; }
        .popup-desc a { color: #2B6CB0; }
        .popup-meta { font-size: .8rem; color: #2D3748; margin-bottom: 4px; display: flex; gap: 7px; align-items: baseline; }
        .popup-meta i { color: var(--accent-gold); width: 14px; text-align: center; }
        .popup-meta:last-of-type { margin-bottom: 12px; }
        .btn-navigate {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #A37F38 100%);
            color: #FFF !important;
            padding: 11px 0; border-radius: 8px;
            text-decoration: none; font-size: .85rem; font-weight: 600;
            box-shadow: 0 3px 8px rgba(197,160,89,.3);
        }
        .btn-navigate:hover { opacity: .9; }

        /* ---------- Marcadores ---------- */
        .custom-pin-wrapper { background: none; border: none; }
        .custom-pin {
            display: flex; justify-content: center; align-items: center;
            border-radius: 50%; color: #FFF;
            box-shadow: 0 3px 8px rgba(0,0,0,.35);
            border: 2px solid #FFF;
            width: 100%; height: 100%;
        }
        .hotel-pin { position: relative; border: 3px solid var(--accent-gold); box-shadow: 0 4px 14px rgba(0,0,0,.45); }
        .hotel-pin::after {
            content: ''; position: absolute; inset: -8px; border-radius: 50%;
            border: 2px solid var(--accent-gold); opacity: 0;
            animation: pulse 2.2s ease-out infinite;
        }
        @keyframes pulse { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(1.4); opacity: 0; } }

        .me-pin { width: 18px; height: 18px; background: #2B6CB0; border: 3px solid #FFF; border-radius: 50%; box-shadow: 0 0 0 2px rgba(43,108,176,.4), 0 2px 6px rgba(0,0,0,.4); }

        @media (prefers-reduced-motion: reduce) { .hotel-pin::after, .spinner { animation: none; } }

        /* Celulares en horizontal: todo más compacto */
        @media (max-height: 480px) {
            header { padding-top: calc(4px + var(--safe-top)); padding-bottom: 4px; }
            .brand-subtitle { display: none; }
            .toolbar { padding-top: 6px; padding-bottom: 6px; gap: 6px; }
            #search { height: 36px; }
            .chip { min-height: 32px; padding: 5px 12px; }
            .fabs { flex-direction: row; right: auto; left: calc(10px + var(--safe-left)); bottom: calc(26px + var(--safe-bottom)); }
            .fab { width: 38px; height: 38px; font-size: .95rem; }
            .leaflet-bottom.leaflet-right .leaflet-control-zoom { margin-bottom: calc(26px + var(--safe-bottom)); }
        }
    </style>
</head>
<body>

    <header>
        <div>
            <div class="brand-title">Agua del Corral</div>
            <div class="brand-subtitle" data-i18n="subtitle">Hotel & Spa • Mendoza</div>
        </div>
        <div class="lang-switch" role="group" aria-label="Idioma / Language">
            <button class="lang-btn" data-lang="es">ES</button>
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="pt">PT</button>
        </div>
    </header>

    <div class="toolbar">
        <div class="search-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="search" type="search" autocomplete="off" data-i18n-ph="search" placeholder="Buscar lugares…" aria-label="Buscar">
            <div id="results" role="listbox"></div>
        </div>
        <div class="cat-wrap"><i class="fa-solid fa-filter"></i><select id="cat-select" aria-label="Categoría"></select><i class="fa-solid fa-chevron-down caret"></i></div>
    </div>

    <div id="map-container">
        <div id="map"></div>

        <div class="fabs">
            <button class="fab" id="btn-hotel" data-i18n-title="hotel" title="Mi hotel"><i class="fa-solid fa-bed"></i></button>
            <button class="fab" id="btn-locate" data-i18n-title="locate" title="Mi ubicación"><i class="fa-solid fa-location-crosshairs"></i></button>
            <button class="fab" id="btn-layer" data-i18n-title="mapType" title="Tipo de mapa"><i class="fa-solid fa-layer-group"></i></button>
        </div>

        <div id="layer-panel" role="menu"></div>

        <div id="status"><div class="spinner"></div><div id="status-text" data-i18n="loading">Cargando puntos de interés…</div></div>
        <div id="toast" role="status"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
    (function () {
        'use strict';

        /* =====================================================
           CONFIGURACIÓN
           ===================================================== */
        const CONFIG = {
            hotel: { lat: -32.89163773879844, lng: -68.83910524709069 },
            sheetCsvUrl: "https://docs.google.com/spreadsheets/d/13xRDP6nPQ8wOObf-a8-gJpn8cN973F4HX8qoZr5Pad0/export?format=csv",
            cacheKey: 'agc_csv_cache_v1',
            langKey: 'agc_lang',
            metersPerMinute: 80,   // ~4,8 km/h
            detourFactor: 1.3,     // la calle real es más larga que la línea recta
            maxWalkMeters: 3000    // más allá de esto no se muestra "min a pie"
        };

        /* =====================================================
           TEXTOS DE LA INTERFAZ
           ===================================================== */
        const I18N = {
            es: {
                subtitle: 'Hotel & Spa • Mendoza', search: 'Buscar lugares…', all: 'Todas las categorías', other: 'Otros',
                hotel: 'Mi hotel', locate: 'Mi ubicación', satellite: 'Satélite', streets: 'Mapa de calles', terrain: 'Terreno', mapType: 'Tipo de mapa', switched: 'El mapa no cargaba: se cambió automáticamente a {n}.',
                directions: 'Cómo llegar', fromHotel: 'del hotel', fromYou: 'de tu ubicación', walk: 'a pie',
                noResults: 'Sin resultados', loading: 'Cargando puntos de interés…',
                errorLoad: 'No se pudieron cargar los puntos de interés. Revisa tu conexión e intenta nuevamente.',
                offline: 'Sin conexión: se muestra la última versión guardada.',
                locDenied: 'No se pudo obtener tu ubicación. Revisa los permisos del navegador.',
                locUnsupported: 'Tu navegador no permite obtener la ubicación.',
                locating: 'Buscando tu ubicación…', youAreHere: 'Estás aquí', retry: 'Reintentar'
            },
            en: {
                subtitle: 'Hotel & Spa • Mendoza', search: 'Search places…', all: 'All categories', other: 'Other',
                hotel: 'My hotel', locate: 'My location', satellite: 'Satellite', streets: 'Street map', terrain: 'Terrain', mapType: 'Map type', switched: 'The map was not loading: automatically switched to {n}.',
                directions: 'Get directions', fromHotel: 'from the hotel', fromYou: 'from your location', walk: 'walk',
                noResults: 'No results', loading: 'Loading points of interest…',
                errorLoad: 'Points of interest could not be loaded. Check your connection and try again.',
                offline: 'Offline: showing the last saved version.',
                locDenied: 'Could not get your location. Check your browser permissions.',
                locUnsupported: 'Your browser does not support geolocation.',
                locating: 'Finding your location…', youAreHere: 'You are here', retry: 'Retry'
            },
            pt: {
                subtitle: 'Hotel & Spa • Mendoza', search: 'Buscar lugares…', all: 'Todas as categorias', other: 'Outros',
                hotel: 'Meu hotel', locate: 'Minha localização', satellite: 'Satélite', streets: 'Mapa de ruas', terrain: 'Relevo', mapType: 'Tipo de mapa', switched: 'O mapa não carregava: mudou automaticamente para {n}.',
                directions: 'Como chegar', fromHotel: 'do hotel', fromYou: 'da sua localização', walk: 'a pé',
                noResults: 'Sem resultados', loading: 'Carregando pontos de interesse…',
                errorLoad: 'Não foi possível carregar os pontos de interesse. Verifique sua conexão e tente novamente.',
                offline: 'Sem conexão: exibindo a última versão salva.',
                locDenied: 'Não foi possível obter sua localização. Verifique as permissões do navegador.',
                locUnsupported: 'Seu navegador não permite obter a localização.',
                locating: 'Buscando sua localização…', youAreHere: 'Você está aqui', retry: 'Tentar novamente'
            }
        };

        // Nombres de categoría por ícono (se usan si la planilla no tiene columna "categoria")
        const ICON_LABELS = {
            'utensils':      { es: 'Restaurantes', en: 'Restaurants', pt: 'Restaurantes' },
            'medkit':        { es: 'Farmacias', en: 'Pharmacies', pt: 'Farmácias' },
            'shopping-cart': { es: 'Supermercados', en: 'Supermarkets', pt: 'Supermercados' },
            'info-circle':   { es: 'Info turística', en: 'Tourist info', pt: 'Info turística' },
            'bus':           { es: 'Transporte', en: 'Transport', pt: 'Transporte' },
            'bed':           { es: 'Hotel', en: 'Hotel', pt: 'Hotel' }
        };

        /* =====================================================
           ESTADO
           ===================================================== */
        let lang = 'es';
        let activeCat = 'all';
        let items = [];
        let userPos = null;
        let userLayer = null;
        

        const $ = id => document.getElementById(id);
        const t = key => (I18N[lang] && I18N[lang][key]) || I18N.es[key] || key;

        /* =====================================================
           UTILIDADES
           ===================================================== */
        function norm(s) {
            return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
        }
        function normHeader(h) {
            return norm(h).replace(/\s+/g, '_');
        }
        function parseCoord(v, min, max) {
            const n = parseFloat(String(v == null ? '' : v).trim().replace(',', '.'));
            return (isFinite(n) && n >= min && n <= max) ? n : null;
        }
        function safeIcon(v) {
            v = String(v || '').trim().toLowerCase();
            return /^[a-z0-9-]+$/.test(v) ? v : 'location-dot';
        }
        function safeColor(v) {
            v = String(v || '').trim();
            if (v && /^[#\w(),.%\s-]+$/.test(v) && window.CSS && CSS.supports('color', v)) return v;
            return '#2B6CB0';
        }
        function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

        function haversine(lat1, lng1, lat2, lng2) {
            const R = 6371000, rad = Math.PI / 180;
            const dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
            const a = Math.sin(dLat / 2) ** 2 +
                      Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) ** 2;
            return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }
        function fmtDist(m) {
            if (m < 1000) return (Math.max(10, Math.round(m / 10) * 10)) + ' m';
            return (m / 1000).toLocaleString(lang === 'en' ? 'en-US' : (lang === 'pt' ? 'pt-BR' : 'es-AR'), { maximumFractionDigits: 1 }) + ' km';
        }
        function distanceText(m, suffixKey) {
            let txt = '≈ ' + fmtDist(m);
            if (m <= CONFIG.maxWalkMeters) {
                const min = Math.max(1, Math.round(m * CONFIG.detourFactor / CONFIG.metersPerMinute));
                txt += ' · ~' + min + ' min ' + t('walk');
            }
            return txt + ' ' + t(suffixKey);
        }

        /* =====================================================
           SANEADOR DE HTML
           Permite que edites la descripción desde el Sheet con
           links (<a href>), negritas, saltos de línea, listas e
           íconos FontAwesome (<i class="fa-solid fa-...">), pero
           elimina scripts, eventos (onclick, etc.) y links peligrosos.
           ===================================================== */
        const ALLOWED_TAGS = new Set(['A','B','STRONG','I','EM','U','BR','P','UL','OL','LI','SPAN','SMALL']);
        const DROP_TAGS = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','TEMPLATE','NOSCRIPT','LINK','META','SVG','MATH']);

        function safeHref(h) {
            try {
                const u = new URL(h, 'https://example.invalid');
                if (['http:', 'https:', 'mailto:', 'tel:'].includes(u.protocol)) return h.trim();
            } catch (e) {}
            return null;
        }

        function appendLinkified(parent, text) {
            const re = /(https?:\/\/[^\s<]+)/g;
            let last = 0, m;
            const pushText = str => {
                str.split('\n').forEach((line, i) => {
                    if (i > 0) parent.appendChild(document.createElement('br'));
                    if (line) parent.appendChild(document.createTextNode(line));
                });
            };
            while ((m = re.exec(text)) !== null) {
                pushText(text.slice(last, m.index));
                const a = document.createElement('a');
                a.href = m[1]; a.target = '_blank'; a.rel = 'noopener noreferrer';
                a.textContent = m[1];
                parent.appendChild(a);
                last = m.index + m[1].length;
            }
            pushText(text.slice(last));
        }

        function cleanNode(src, dest, insideLink) {
            src.childNodes.forEach(node => {
                if (node.nodeType === 3) {               // texto
                    if (insideLink) dest.appendChild(document.createTextNode(node.nodeValue));
                    else appendLinkified(dest, node.nodeValue);
                } else if (node.nodeType === 1) {        // elemento
                    const tag = node.tagName.toUpperCase();
                    if (DROP_TAGS.has(tag)) return;
                    if (ALLOWED_TAGS.has(tag)) {
                        const el = document.createElement(tag.toLowerCase());
                        if (tag === 'A') {
                            const href = safeHref(node.getAttribute('href') || '');
                            if (href) { el.setAttribute('href', href); el.target = '_blank'; el.rel = 'noopener noreferrer'; }
                        }
                        if (tag === 'I' || tag === 'SPAN') {
                            const cls = (node.getAttribute('class') || '').split(/\s+/)
                                .filter(c => /^fa(-[a-z0-9-]+)?$/.test(c));
                            if (cls.length) el.className = cls.join(' ');
                        }
                        cleanNode(node, el, insideLink || tag === 'A');
                        dest.appendChild(el);
                    } else {
                        cleanNode(node, dest, insideLink);   // etiqueta no permitida: se conserva solo el texto
                    }
                }
            });
        }

        function sanitizeToFragment(html) {
            const frag = document.createDocumentFragment();
            const doc = new DOMParser().parseFromString('<body>' + String(html || ''), 'text/html');
            cleanNode(doc.body, frag, false);
            return frag;
        }
        function plainText(html) {
            const box = document.createElement('div');
            box.appendChild(sanitizeToFragment(html));
            return box.textContent || '';
        }

        /* =====================================================
           MAPA
           ===================================================== */
        const map = L.map('map', { zoomControl: false, tap: true }).setView([CONFIG.hotel.lat, CONFIG.hotel.lng], 16);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        const PROVIDERS = [
            { id: 'esri', name: 'Esri', url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
              attr: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, and the GIS User Community', kind: 'street' },
            { id: 'osm', name: 'OpenStreetMap', url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
              attr: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>', kind: 'street' },
            { id: 'sat', labelKey: 'satellite', url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
              attr: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics', kind: 'sat' },
            { id: 'topo', labelKey: 'terrain', url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', sub: 'abc', maxNative: 17,
              attr: 'Map data: &copy; OpenStreetMap contributors, SRTM | Style: &copy; <a href="https://opentopomap.org" target="_blank" rel="noopener">OpenTopoMap</a> (CC-BY-SA)', kind: 'topo' }
        ];
        const labelOf = i => PROVIDERS[i].labelKey ? t(PROVIDERS[i].labelKey) : PROVIDERS[i].name;

        const providerLayers = PROVIDERS.map(p => L.tileLayer(p.url, {
            maxZoom: 19, maxNativeZoom: p.maxNative || 19, subdomains: p.sub || 'abc',
            detectRetina: !!p.retina, keepBuffer: 4, updateWhenZooming: false, attribution: p.attr
        }));

        let baseIdx = 0;
        const failedProviders = new Set();
        try {
            const saved = localStorage.getItem('agc_basemap');
            const k = PROVIDERS.findIndex(p => p.id === saved);
            if (k >= 0) baseIdx = k;
        } catch (e) {}

        // Vigilancia: si un proveedor da errores o no carga en 15 s, se pasa automáticamente al siguiente
        function failover(i) {
            if (baseIdx !== i) return;
            failedProviders.add(i);
            const next = PROVIDERS.findIndex((p, k) => p.kind === 'street' && !failedProviders.has(k));
            if (next < 0) return;
            setBase(next, true);
            toast(t('switched').replace('{n}', labelOf(next)), 7000);
        }
        providerLayers.forEach((lyr, i) => {
            let errs = 0, timer = null, first = true;
            lyr.on('add', () => { first = true; errs = 0; clearTimeout(timer); });
            lyr.on('tileerror', () => { if (++errs === 6) failover(i); });
            lyr.on('loading', () => {
                if (first && baseIdx === i) { first = false; timer = setTimeout(() => failover(i), 15000); }
            });
            lyr.on('load', () => clearTimeout(timer));
        });

        function setBase(i, auto) {
            if (i === baseIdx && map.hasLayer(providerLayers[i])) return;
            if (map.hasLayer(providerLayers[baseIdx])) map.removeLayer(providerLayers[baseIdx]);
            baseIdx = i;
            providerLayers[baseIdx].addTo(map);
            if (!auto) { try { localStorage.setItem('agc_basemap', PROVIDERS[i].id); } catch (e) {} }
            renderLayerPanel();
        }

        function renderLayerPanel() {
            const box = $('layer-panel');
            if (!box) return;
            box.innerHTML = '';
            const h = document.createElement('div');
            h.className = 'lp-title'; h.textContent = t('mapType');
            box.appendChild(h);
            PROVIDERS.forEach((p, i) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'lp-item' + (i === baseIdx ? ' active' : '');
                b.innerHTML = '<i class="fa-solid fa-check"></i>';
                b.appendChild(document.createTextNode(labelOf(i)));
                b.addEventListener('click', () => { failedProviders.delete(i); setBase(i, false); box.classList.remove('open'); });
                box.appendChild(b);
            });
        }

        providerLayers[baseIdx].addTo(map);

        const markersLayer = L.layerGroup().addTo(map);

        function refreshMapSize() { map.invalidateSize(); }
        window.addEventListener('resize', refreshMapSize);
        window.addEventListener('orientationchange', () => setTimeout(refreshMapSize, 250));
        if ('ResizeObserver' in window) new ResizeObserver(refreshMapSize).observe($('map-container'));

        /* =====================================================
           CARGA DE DATOS (Google Sheet)
           ===================================================== */
        function showStatus(textKey, withSpinner, retry) {
            const box = $('status');
            box.classList.remove('hidden');
            box.innerHTML = '';
            if (withSpinner) { const sp = document.createElement('div'); sp.className = 'spinner'; box.appendChild(sp); }
            const msg = document.createElement('div');
            msg.textContent = t(textKey);
            msg.setAttribute('data-i18n', textKey);
            box.appendChild(msg);
            if (retry) {
                const b = document.createElement('button');
                b.className = 'chip active'; b.textContent = t('retry');
                b.addEventListener('click', loadData);
                box.appendChild(b);
            }
        }
        function hideStatus() { $('status').classList.add('hidden'); }

        let toastTimer;
        function toast(msg, ms) {
            const el = $('toast');
            el.textContent = msg; el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), ms || 4000);
        }

        async function fetchCsv() {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 12000);
            try {
                const res = await fetch(CONFIG.sheetCsvUrl, { signal: ctrl.signal });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const text = await res.text();
                try { localStorage.setItem(CONFIG.cacheKey, text); } catch (e) {}
                return { text, fromCache: false };
            } finally { clearTimeout(timer); }
        }

        async function loadData() {
            showStatus('loading', true, false);
            let csv = null, fromCache = false;
            try {
                const r = await fetchCsv();
                csv = r.text;
            } catch (err) {
                console.error('Error al leer el Google Sheet:', err);
                try { csv = localStorage.getItem(CONFIG.cacheKey); fromCache = !!csv; } catch (e) {}
            }
            if (!csv) { showStatus('errorLoad', false, true); return; }

            const parsed = Papa.parse(csv, {
                header: true, skipEmptyLines: true, transformHeader: normHeader
            });
            buildItems(parsed.data);
            hideStatus();
            if (fromCache) toast(t('offline'), 6000);
        }

        /* =====================================================
           CONSTRUCCIÓN DE PUNTOS
           ===================================================== */
        function buildItems(rows) {
            items = [];
            markersLayer.clearLayers();

            rows.forEach(r => {
                const lat = parseCoord(r.latitud, -90, 90);
                const lng = parseCoord(r.longitud, -180, 180);
                const name = String(r.nombre || '').trim();
                if (lat === null || lng === null || !name) return;   // fila inválida: se ignora

                const icon = safeIcon(r.icono);
                const isHotel = String(r.hotel || '').toLowerCase() === 'si'
                    || haversine(lat, lng, CONFIG.hotel.lat, CONFIG.hotel.lng) < 3;   // solo la fila con las coordenadas exactas del hotel
                const catRaw = String(r.categoria || '').trim();

                const item = {
                    row: r, lat, lng, icon, isHotel,
                    color: isHotel ? '#C5A059' : safeColor(r.color),
                    catKey: norm(catRaw) || '__otros',
                    hasCatColumn: !!catRaw
                };
                item.marker = L.marker([lat, lng], { icon: makeIcon(item), zIndexOffset: isHotel ? 1000 : 0, keyboard: true, title: name })
                    .bindPopup(() => buildPopup(item), { maxWidth: 300, autoPanPadding: [24, 24] });
                item.search = norm(['es', 'en', 'pt'].map(l => getName(item, l) + ' ' + plainText(getDesc(item, l)) + ' ' + getCat(item, l)).join(' '));
                items.push(item);
            });

            renderChips();
            applyFilter();

            // Ajusta la vista para que se vean todos los puntos
            const pts = items.map(i => [i.lat, i.lng]);
            if (pts.length > 1) map.fitBounds(pts, { padding: [40, 40], maxZoom: 16 });
        }

        function makeIcon(item) {
            const size = item.isHotel ? 46 : 34;
            const pin = document.createElement('div');
            pin.className = 'custom-pin' + (item.isHotel ? ' hotel-pin' : '');
            pin.style.backgroundColor = item.isHotel ? '#1A2B3C' : item.color;
            const i = document.createElement('i');
            i.className = 'fa-solid fa-' + (item.isHotel ? 'bed' : item.icon);
            i.style.fontSize = item.isHotel ? '18px' : '14px';
            if (item.isHotel) i.style.color = '#C5A059';
            pin.appendChild(i);
            return L.divIcon({
                className: 'custom-pin-wrapper', html: pin,
                iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -size / 2]
            });
        }

        /* ---- Datos según idioma (con respaldo en español) ---- */
        function pick(row, base, l) {
            if (l !== 'es' && row[base + '_' + l]) return row[base + '_' + l];
            return row[base] || '';
        }
        function getName(item, l) { return String(pick(item.row, 'nombre', l || lang)).trim(); }
        function getDesc(item, l) { return pick(item.row, 'descripcion', l || lang); }
        function getCat(item, l) {
            l = l || lang;
            const r = item.row;
            if (item.hasCatColumn) return String(pick(r, 'categoria', l)).trim();
            return (I18N[l] && I18N[l].other) || 'Otros';
        }

        /* =====================================================
           POPUP
           ===================================================== */
        function metaLine(iconClass, text) {
            const d = document.createElement('div');
            d.className = 'popup-meta';
            const i = document.createElement('i'); i.className = 'fa-solid fa-' + iconClass;
            const s = document.createElement('span'); s.textContent = text;
            d.appendChild(i); d.appendChild(s);
            return d;
        }

        function buildPopup(item) {
            const card = document.createElement('div');
            card.className = 'popup-card';

            const h = document.createElement('h4');
            h.textContent = getName(item);
            card.appendChild(h);

            const cat = document.createElement('span');
            cat.className = 'popup-cat';
            cat.textContent = item.isHotel ? 'Hotel' : getCat(item);
            card.appendChild(cat);

            const desc = document.createElement('div');
            desc.className = 'popup-desc';
            desc.appendChild(sanitizeToFragment(getDesc(item)));
            card.appendChild(desc);

            if (!item.isHotel) {
                const d = haversine(CONFIG.hotel.lat, CONFIG.hotel.lng, item.lat, item.lng);
                card.appendChild(metaLine('person-walking', distanceText(d, 'fromHotel')));
            }
            if (userPos) {
                const du = haversine(userPos.lat, userPos.lng, item.lat, item.lng);
                card.appendChild(metaLine('location-crosshairs', distanceText(du, 'fromYou')));
            }

            const a = document.createElement('a');
            a.className = 'btn-navigate';
            a.href = 'https://www.google.com/maps/dir/?api=1&destination=' + item.lat + ',' + item.lng + '&travelmode=walking';
            a.target = '_blank'; a.rel = 'noopener noreferrer';
            a.innerHTML = '<i class="fa-solid fa-location-arrow"></i> ';
            a.appendChild(document.createTextNode(t('directions')));
            card.appendChild(a);
            return card;
        }

        /* =====================================================
           CATEGORÍAS (chips)
           ===================================================== */
        function renderChips() {
            const sel = $('cat-select');
            sel.innerHTML = '';

            // Las categorías salen automáticamente de la columna "categoria" del Sheet
            const groups = new Map();
            let total = 0;
            items.forEach(it => {
                if (it.isHotel) return;
                total++;
                if (!groups.has(it.catKey)) groups.set(it.catKey, { key: it.catKey, label: getCat(it), n: 0 });
                groups.get(it.catKey).n++;
            });
            const list = Array.from(groups.values()).sort((a, b) => {
                if (a.key === '__otros') return 1;
                if (b.key === '__otros') return -1;
                return a.label.localeCompare(b.label, lang);
            });

            const add = (value, label) => {
                const o = document.createElement('option');
                o.value = value; o.textContent = label;
                sel.appendChild(o);
            };
            add('all', t('all') + ' (' + total + ')');
            list.forEach(g => add(g.key, g.label + ' (' + g.n + ')'));

            if (activeCat !== 'all' && !groups.has(activeCat)) activeCat = 'all';
            sel.value = activeCat;
        }

        function applyFilter(fit) {
            markersLayer.clearLayers();
            const visible = [];
            items.forEach(it => {
                if (it.isHotel || activeCat === 'all' || it.catKey === activeCat) {
                    markersLayer.addLayer(it.marker);
                    if (!it.isHotel) visible.push([it.lat, it.lng]);
                }
            });
            if (fit && visible.length) {
                const pts = visible.concat([[CONFIG.hotel.lat, CONFIG.hotel.lng]]);
                map.fitBounds(pts, { padding: [40, 40], maxZoom: 17 });
            }
        }

        /* =====================================================
           BUSCADOR (solo busca en lo que cargues en el Sheet)
           ===================================================== */
        const searchInput = $('search'), resultsBox = $('results');

        function renderResults() {
            const q = norm(searchInput.value);
            resultsBox.innerHTML = '';
            if (!q) { resultsBox.classList.remove('open'); return; }

            const found = items.filter(it => it.search.includes(q)).slice(0, 8);
            if (!found.length) {
                const d = document.createElement('div');
                d.className = 'no-results'; d.textContent = t('noResults');
                resultsBox.appendChild(d);
            }
            found.forEach(it => {
                const b = document.createElement('button');
                b.type = 'button'; b.className = 'result-item';
                const dot = document.createElement('span'); dot.className = 'result-dot'; dot.style.backgroundColor = it.color;
                const i = document.createElement('i'); i.className = 'fa-solid fa-' + (it.isHotel ? 'bed' : it.icon);
                dot.appendChild(i);
                const txt = document.createElement('span'); txt.className = 'result-text';
                txt.appendChild(document.createTextNode(getName(it)));
                const small = document.createElement('small'); small.textContent = it.isHotel ? 'Hotel' : getCat(it);
                txt.appendChild(small);
                b.appendChild(dot); b.appendChild(txt);
                b.addEventListener('click', () => goTo(it));
                resultsBox.appendChild(b);
            });
            resultsBox.classList.add('open');
        }

        function goTo(it) {
            if (!it.isHotel && activeCat !== 'all' && it.catKey !== activeCat) {
                activeCat = 'all'; renderChips(); applyFilter(false);
            }
            resultsBox.classList.remove('open');
            searchInput.blur();
            map.once('moveend', () => it.marker.openPopup());
            map.flyTo([it.lat, it.lng], 17, { duration: 0.8 });
        }

        searchInput.addEventListener('input', renderResults);
        searchInput.addEventListener('focus', renderResults);
        searchInput.addEventListener('keydown', e => {
            if (e.key === 'Escape') { resultsBox.classList.remove('open'); searchInput.blur(); }
            if (e.key === 'Enter') { const first = resultsBox.querySelector('.result-item'); if (first) first.click(); }
        });
        document.addEventListener('click', e => {
            if (!e.target.closest('.search-wrap')) resultsBox.classList.remove('open');
        });

        /* =====================================================
           BOTONES: hotel, mi ubicación, tipo de mapa
           ===================================================== */
        $('btn-hotel').addEventListener('click', () => {
            map.flyTo([CONFIG.hotel.lat, CONFIG.hotel.lng], 17, { duration: 1.2 });
        });

        $('btn-layer').addEventListener('click', e => {
            e.stopPropagation();
            renderLayerPanel();
            $('layer-panel').classList.toggle('open');
        });
        document.addEventListener('click', e => {
            if (!e.target.closest('#layer-panel') && !e.target.closest('#btn-layer')) $('layer-panel').classList.remove('open');
        });
        map.on('click', () => $('layer-panel').classList.remove('open'));
        function updateLayerTitle() {
            $('btn-layer').title = t('mapType');
            renderLayerPanel();
        }

        $('btn-locate').addEventListener('click', () => {
            if (!('geolocation' in navigator)) { toast(t('locUnsupported')); return; }
            toast(t('locating'), 8000);
            navigator.geolocation.getCurrentPosition(pos => {
                userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                if (userLayer) map.removeLayer(userLayer);
                const dot = L.marker([userPos.lat, userPos.lng], {
                    icon: L.divIcon({ className: 'custom-pin-wrapper', html: '<div class="me-pin"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }),
                    zIndexOffset: 2000, title: t('youAreHere')
                }).bindPopup(t('youAreHere'));
                const circle = L.circle([userPos.lat, userPos.lng], {
                    radius: pos.coords.accuracy, color: '#2B6CB0', weight: 1, fillColor: '#2B6CB0', fillOpacity: .12
                });
                userLayer = L.layerGroup([circle, dot]).addTo(map);
                $('btn-locate').classList.add('on');
                $('toast').classList.remove('show');
                map.flyTo([userPos.lat, userPos.lng], 16, { duration: 1 });
            }, () => {
                toast(t('locDenied'), 5000);
            }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
        });

        /* =====================================================
           IDIOMA
           ===================================================== */
        function applyLang(l) {
            lang = I18N[l] ? l : 'es';
            document.documentElement.lang = lang;
            try { localStorage.setItem(CONFIG.langKey, lang); } catch (e) {}

            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
            document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.getAttribute('data-i18n-title')); });
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
            updateLayerTitle();

            map.closePopup();
            if (items.length) { renderChips(); }
            if (resultsBox.classList.contains('open')) renderResults();
        }

        document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));

        /* =====================================================
           INICIO
           ===================================================== */
        $('cat-select').addEventListener('change', e => { activeCat = e.target.value; applyFilter(true); });

        (function init() {
            let saved = null;
            try { saved = localStorage.getItem(CONFIG.langKey); } catch (e) {}
            const browser = (navigator.language || 'es').slice(0, 2).toLowerCase();
            applyLang(saved || (I18N[browser] ? browser : 'es'));
            loadData();
        })();
    })();
    </script>
</body>
</html>
